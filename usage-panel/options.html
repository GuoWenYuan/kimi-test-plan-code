<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI 工作台用量面板 · 设置</title>
  <style>
    body { font: 13px/1.6 system-ui, sans-serif; max-width: 460px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 16px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 9px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
    button { margin-top: 18px; padding: 7px 18px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 13px; cursor: pointer; }
    #status { margin-top: 10px; color: #2a7d2a; }
    .hint { margin-top: 6px; color: #777; font-size: 12px; font-weight: 400; }
  </style>
</head>
<body>
  <h1>AI 工作台用量面板 · 设置</h1>
  <label>
    工作台地址
    <input id="url" placeholder="如 http://192.168.1.10:3000" />
    <div class="hint">你的 AI 工作台（workbench）访问地址，不要以 / 结尾也没关系。</div>
  </label>
  <label>
    个人 API 令牌
    <input id="token" type="password" placeholder="工作台 → 知识库 → MCP 接入 → 获取令牌" />
    <div class="hint">在工作台「知识库」页的「MCP 接入」区块获取/重置。令牌只保存在本机浏览器。</div>
  </label>
  <button id="save">保存</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
